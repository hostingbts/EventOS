<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EventOS" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <title>EventOS</title>
    <script>
      // Restore path redirected through 404.html (GitHub Pages SPA trick)
      (function () {
        var p = window.location.search.match(/[?&]p=([^&]*)/);
        if (p) {
          var path = decodeURIComponent(p[1]);
          var q = path.match(/&q=(.*)/);
          var search = q ? '?' + decodeURIComponent(q[1]) : '';
          path = path.replace(/&q=.*/, '');
          window.history.replaceState(
            null, null,
            window.location.pathname.split('/').slice(0, 2).join('/') + '/' + path + search + window.location.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
